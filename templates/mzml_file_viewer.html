<!DOCTYPE html>
<html>
<head>
    <script>
        function updatePlot() {
            var xic_mass = $('#xic_mass').val();
            var mass_deviation = $('#mass_deviation').val();
            var spec_index = $('#spec_index').val();
            var fileSelect = $('#fileSelect').val();

            // Show loading circle before the request
            $('#plotArea1').html('<div class="loader">Loading...</div>');
            $('#plotArea2').html('<div class="loader">Loading...</div>');

            // Add CSS for the loader
            $('<style>.loader {border: 16px solid #f3f3f3; border-radius: 50%; border-top: 16px solid #3498db; width: 120px; height: 120px; -webkit-animation: spin 2s linear infinite; animation: spin 2s linear infinite; position: relative; top: 20%; left: 30%; transform: translate(-20%, -30%);} @-webkit-keyframes spin {0% { -webkit-transform: rotate(0deg); } 100% { -webkit-transform: rotate(360deg); }} @keyframes spin {0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); }}</style>').appendTo('head');

            $.ajax({
                url: '/update_mzml_plot_viewer_plots', // replace with your Flask route
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ 'xic_mass': xic_mass, 'spec_index': spec_index, "fileSelect": fileSelect, "mass_deviation": mass_deviation }),
                success: function(response) {
                    // Assuming the response is a matplotlib object
                    var plot1 = response['plot1'];
                    var plot2 = response['plot2'];

                    // Convert the matplotlib objects to base64 encoded PNG
                    var plot1Base64 = 'data:image/png;base64,' + plot1;
                    var plot2Base64 = 'data:image/png;base64,' + plot2;

                    // Append the images to the divs with style to fit the container
                    $('#plotArea1').html('<img src="' + plot1Base64 + '" style="max-width:100%; height: auto;">');
                    $('#plotArea2').html('<img src="' + plot2Base64 + '" style="max-width:100%; height: auto;">');
                    
                },
                error: function(error) {
                    console.log(error);
                }
            });

            
        }
    </script>
    <script>
        function downloadPlots() {
            if(document.getElementById('plot1Checkbox').checked) {
                var link = document.createElement('a');
                link.href = $('#plotArea1').find('img').attr('src');
                link.download = 'plot1.png';
                link.click();
            }
            if(document.getElementById('plot2Checkbox').checked) {
                var link = document.createElement('a');
                link.href = $('#plotArea2').find('img').attr('src');
                link.download = 'plot2.png';
                link.click();
            }
        }
    </script>
    <style>
        body p {
            width: 50%;
            text-align: left;
            font-family: Arial, sans-serif;
            font-size: 1.1em;
            color: #333;
        }
        .plot_div {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}

    <h1>.mzML viewer</h1>

    <div class="form">
        <label for="fileSelect">Select a file:</label>
        <select id="fileSelect" name="fileSelect" style=</div>"margin-bottom: 10px;">
            {% for file in files %}
                <option value="{{ file }}">{{ file }}</option>
            {% endfor %}
        </select>
        <label for="xic_mass">XIC mass [u]:</label>
        <input type="number" id="xic_mass" name="xic_mass" step="0.0001" style="margin-bottom: 10px;">
        <label for="mass_deviation">Mass Deviation [u]:</label>
        <input type="number" id="mass_deviation" name="mass_deviation" step="0.0001" style="margin-bottom: 10px;">
        <label for="spec_index">Spectrum index:</label>
        <input type="number" id="spec_index" name="spec_index" style="margin-bottom: 10px;">
        <button onclick="updatePlot()" style="padding: 10px 20px;">Go!</button>
    </div>

    <hr>

    <div class="form">
        <input type="checkbox" id="plot1Checkbox" name="plot1Checkbox">
        <label for="plot1Checkbox">Download Plot 1</label>
        <input type="checkbox" id="plot2Checkbox" name="plot2Checkbox">
        <label for="plot2Checkbox">Download Plot 2</label>
        <button onclick="downloadPlots()" style="padding: 10px 20px;">Download</button>
    </div>

    <hr>

    <div class="plot_div">
        <div id="plotArea1" style="width: 50%; height: 500px; border: 1px solid black;">XIC</div>
        <div id="plotArea2" style="width: 50%; height: 500px; border: 1px solid black;">Mass spectrum</div>
    </div>

    <hr>

    <div>
        

    </div>

    
</body>
</html>
